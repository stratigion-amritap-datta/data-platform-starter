version: 2

models:
  - name: stg_customers
    description: Cleaned customers. One row per customer, renamed and typed from raw_customers.
    columns:
      - name: customer_id
        description: Stable customer identifier from the store.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer given name, trimmed.
        data_tests:
          - not_null
      - name: last_name
        description: Customer family name, trimmed.
        data_tests:
          - not_null
      - name: email
        description: Email address, trimmed and lowercased.
        data_tests:
          - unique
          - not_null
      - name: country
        description: Country on the current customer record.
        data_tests:
          - not_null
      - name: signup_date
        description: Date the customer created an account.
        data_tests:
          - not_null
      - name: updated_at
        description: Last time the customer source row changed.
        data_tests:
          - not_null

  - name: stg_orders
    description: Cleaned orders. One row per order, renamed and typed from raw_orders.
    columns:
      - name: order_id
        description: Stable order identifier from the store.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: ordered_at
        description: Timestamp the order was placed.
        data_tests:
          - not_null
      - name: order_status
        description: Latest fulfillment status from the extract, lowercased.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'paid', 'shipped', 'delivered', 'returned', 'cancelled']
      - name: payment_method
        description: How the customer paid, lowercased.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['card', 'paypal', 'gift_card', 'bank_transfer']
      - name: currency_code
        description: ISO currency of the order amounts. This sample is USD only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
      - name: subtotal_amount
        description: Merchandise amount before discount, tax, and shipping.
        data_tests:
          - not_null
      - name: discount_amount
        description: Discount taken off the subtotal. Zero when no discount was applied.
        data_tests:
          - not_null
      - name: tax_amount
        description: Tax charged on the order.
        data_tests:
          - not_null
      - name: shipping_amount
        description: Shipping charged on the order. Zero when shipping was free.
        data_tests:
          - not_null
      - name: refund_amount
        description: Amount refunded so far, in the order currency. Zero when nothing has been refunded.
        data_tests:
          - not_null
      - name: updated_at
        description: Source update timestamp. fct_orders uses this as the incremental watermark.
        data_tests:
          - not_null
