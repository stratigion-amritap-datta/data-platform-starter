name: data_platform_starter
version: "1.0.0"
config-version: 2
profile: data_platform_starter

require-dbt-version: [">=1.11.0", "<1.12.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  # Orders touched inside this window are re-merged on each incremental run.
  orders_lookback_days: 2

seeds:
  data_platform_starter:
    +schema: raw
    +quote_columns: false
    raw_customers:
      +column_types:
        customer_id: varchar
        first_name: varchar
        last_name: varchar
        email: varchar
        country: varchar
        signup_date: date
        updated_at: timestamp
    raw_orders:
      +column_types:
        order_id: varchar
        customer_id: varchar
        ordered_at: timestamp
        status: varchar
        payment_method: varchar
        currency: varchar
        subtotal_amount: decimal(12,2)
        discount_amount: decimal(12,2)
        tax_amount: decimal(12,2)
        shipping_amount: decimal(12,2)
        refund_amount: decimal(12,2)
        updated_at: timestamp

models:
  data_platform_starter:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
